<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Document</title>

  <!-- Set theme before the page draws, to avoid a white flash in dark mode -->
  <script>
    (function () {
      var p = "auto";
      try { p = localStorage.getItem("nccsSig.theme") || "auto"; } catch (e) {}
      var dark = p === "dark" ||
        (p === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    /* ---------- Theme colours ---------- */
    :root {
      color-scheme: light;
      --bg: #f3f3f3;  --card: #ffffff;  --text: #1a1a1a;  --muted: #888888;  --soft: #555555;
      --border: #cccccc;  --hover: #f5f5f5;  --input-bg: #ffffff;  --accent: #0078d4;
      --shadow: 0 1px 3px rgba(0,0,0,.10);
      --header-bg: #0078d4;
      --sec-bg: #e8e8e8;  --sec-text: #333333;  --sec-hover: #d8d8d8;
      --stu-bg: #deeffe;  --stu-text: #0063b1;  --ass-bg: #dff6dd;  --ass-text: #0e6b0e;
      --re-bg: #fff4ce;   --re-text: #8a6100;   --guess-bg: #eeeeee; --guess-text: #555555;
      --ok-bg: #dff6dd;   --ok-text: #107c10;   --err-bg: #fde7e9;   --err-text: #c50f1f;
      --info-bg: #eff6fc; --info-text: #0078d4;
      --canvas-border: #c8c8c8;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;

      --border: #555555;  --hover: #353535;  --input-bg: #1f1f1f;  --accent: #4ea1e8;
      --shadow: 0 1px 3px rgba(0,0,0,.5);
      --header-bg: #1b4f80;
      --sec-bg: #3a3a3a;  --sec-text: #f0f0f0;  --sec-hover: #474747;
      --stu-bg: #16324d;  --stu-text: #8cc4f2;  --ass-bg: #1d3b1d;  --ass-text: #92d392;
      --re-bg: #4a3b00;   --re-text: #ffd75e;   --guess-bg: #3a3a3a; --guess-text: #cfcfcf;

      --info-bg: #16324d; --info-text: #8cc4f2;
      --canvas-border: #666666;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      padding-bottom: 16px;
    }

    /* Header */
    .header {
      background: var(--header-bg); color: #fff; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
    .header p  { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .dev-tag {
      font-size: 10px; background: #ffb900; color: #000;
      padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle;
    }
    .theme-btn {
      background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5);
      border-radius: 12px; font-size: 11px; padding: 2px 8px; cursor: pointer;
      white-space: nowrap; font-family: inherit;
    }
    .theme-btn:hover { background: rgba(255,255,255,.15); }

    /* Cards */
    .card {
      background: var(--card); border-radius: 6px; padding: 14px;
      margin: 12px 12px 0; box-shadow: var(--shadow);
    }
    .card-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--muted); margin-bottom: 10px;
    }

    /* Toggle */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
