<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<title>Signature Add-in DEV - Step 2</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; margin: 10px; }
  h3 { margin: 4px 0 8px; }
  fieldset { border: 1px solid #ccc; margin: 0 0 10px; padding: 8px; }
  button { margin: 2px 4px 2px 0; padding: 5px 10px; }
  textarea { width: 100%; height: 360px; box-sizing: border-box;
             font-family: Consolas, "Courier New", monospace; font-size: 11px;
             white-space: pre; overflow: auto; }
  .note { color: #666; font-size: 11px; margin-bottom: 4px; }
  #status { margin-left: 6px; color: #1a3d8f; }
</style>
</head>
<body>
  <h3>DEV build - Step 2 tests</h3>

  <fieldset>
    <legend>1. Scan test</legend>
    <label>Compare with:
      <select id="expected">
        <option value="">(none)</option>
        <option>MEM09009</option>
        <option>MEM11011</option>
        <option>MEM07005</option>
      </select>
    </label><br>
    <label><input type="checkbox" id="trace" checked> Show trace</label><br>
    <button id="btnScan">Scan document</button>
  </fieldset>

  <fieldset>
    <legend>2. Alt text test</legend>
    <div class="note">Click an empty spot in the document first. Insert, wait for "Saved",
      close and reopen the document, open this panel again, then Read back.</div>
    <button id="btnInsertTest">Insert test picture</button>
    <button id="btnReadBack">Read back pictures</button>
  </fieldset>

  <button id="btnCopy">Copy output</button><span id="status"></span>
  <textarea id="out" readonly></textarea>

  <script src="taskpane.js?v=step2a"></script>
</body>
</html>
